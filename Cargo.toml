[workspace]
members = [
    "crates/ifg-client",
    "crates/ifg",
    "tests/e2e",
]
resolver = "2"

# Shared package metadata, inherited by every crate via `*.workspace = true`.
[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
authors = ["Yu Qu <zdz945244799@yeah.net>"]
repository = "https://git233.phynews.com:18443/aicodeing/ifg"

# IronForge commit the API contract snapshot and the local Docker e2e instance
# are built from (design doc §6.4). Bumping it is an explicit commit:
# rebuild the image → sync the OpenAPI snapshot → run e2e.
[workspace.metadata.ifg]
ironforge_rev = "ce4834f03a782ea872df88414ea6f4a406762757"

[workspace.dependencies]
ifg-client = { path = "crates/ifg-client" }

# HTTP / serialization (D7: rustls with the system trust store so
# self-signed intranet CAs work; no OpenSSL dependency).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "json",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
] }
url = "2"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rpassword = "7"
sha2 = "0.10"

# Testing
assert_cmd = "2"
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
