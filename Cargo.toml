[workspace]
members = [
    "crates/ifg-client",
    "crates/ifg",
    "tests/e2e",
]
resolver = "2"

# Shared package metadata, inherited by every crate via `*.workspace = true`.
[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
authors = ["Yu Qu <zdz945244799@yeah.net>"]
repository = "https://git233.phynews.com:18443/aicodeing/ifg"

# The unmodified baseline snapshot and isolated Docker e2e use this local image.
# The newer ~ifg-compat snapshot is generated from the IronForge development
# branch (IronForge b5c37ec) and is not a claim about the image below.
# The image has no
# source-revision label, so its tag is not proof of a commit.
# Replacing this baseline requires a fresh snapshot and an e2e run.
[workspace.metadata.ifg]
ironforge_image_id = "sha256:db92748f9ff91257805e647742e8c056d13f2054c1571a0537e2e75909fbd2b8"
ironforge_version = "0.2.0"

[workspace.dependencies]
ifg-client = { path = "crates/ifg-client" }

# HTTP / serialization (D7: rustls with the system trust store so
# self-signed intranet CAs work; no OpenSSL dependency).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "json",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
] }
url = "2"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
comfy-table = "7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rpassword = "7"
sha2 = "0.10"

# Testing
assert_cmd = "2"
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
