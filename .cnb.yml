# CNB is the development upstream (see AGENTS.md), so the Linux gate runs here
# as well as on GitHub. `scripts/check.sh` is invoked unchanged: it is the same
# script .github/workflows/ci.yml runs.
#
# Boundary: this file only covers the Linux check. The Windows job and the
# four-architecture release stay on GitHub (.github/workflows/), untouched:
# `ring` needs each platform's own C toolchain, so they cannot be moved here.
#
# Toolchain: the rust image tag is pinned to the exact patch release and must
# agree with rust-toolchain.toml. The version assertion in the first stage is
# what turns a silently re-tagged image into a red build instead of drift.
#
# Triggered on `main` and on pull requests targeting it. Note what a
# `pull_request` run means on CNB: the config comes from the *source* branch,
# the workspace is the pre-merge commit, and CNB_TOKEN is narrowed because PR
# events are untrusted. Nothing here needs a token, so that costs us nothing.

main:
  push:
    - name: ci
      # Supersede an in-flight run of the same branch instead of queueing.
      lock:
        key: ci
        cancel-in-progress: true
      docker:
        image: rust:1.99.1-bookworm
        volumes:
          # Node-local cargo caches. OverlayFS copy-on-write so concurrent
          # pipelines can share one copy instead of fighting over writes.
          - /usr/local/rustup:copy-on-write
          - /usr/local/cargo:copy-on-write
      env:
        RUST_TOOLCHAIN: "1.99.1"
        RUSTUP_HOME: /usr/local/rustup
        CARGO_HOME: /usr/local/cargo
      stages: &stages
        - name: toolchain version assertion
          script: |
            set -euo pipefail
            rustc --version
            cargo --version
            have="$(rustc --version | cut -d' ' -f2)"
            if [ "$have" != "$RUST_TOOLCHAIN" ]; then
                echo "rustc $have but the image tag and rust-toolchain.toml say $RUST_TOOLCHAIN" >&2
                echo "the rust:<tag> image was probably re-tagged; update .cnb.yml and rust-toolchain.toml together" >&2
                exit 1
            fi
            rustup component list --installed

        - name: install cargo-audit
          # Advisory DB is the whole point of the audit step, so this either
          # installs or the stage fails loudly. It is deliberately *not*
          # allowed to fail silently: check.sh skips `cargo audit` when the
          # binary is missing, which would turn the gate green without an
          # audit. When installs are not possible (no crates.io egress, or a
          # crates.io/MSRV mismatch on this pinned toolchain) set the env
          # variable below to skip the audit *and* its dependency boundary
          # stays enforced by check.sh regardless.
          if: |
            [ "${CNB_SKIP_CARGO_AUDIT:-}" != "true" ]
          script: |
            set -euo pipefail
            if cargo audit --version >/dev/null 2>&1; then
                echo "cargo-audit already present"
            else
                cargo install cargo-audit --locked
            fi
            cargo audit --version

        - name: announce skipped cargo-audit
          if: |
            [ "${CNB_SKIP_CARGO_AUDIT:-}" = "true" ]
          script: |
            set -euo pipefail
            echo ":: CNB_SKIP_CARGO_AUDIT=true: cargo-audit install skipped on purpose."
            echo ":: scripts/check.sh will print 'cargo-audit not installed; skipped'."
            echo ":: The advisory gate is NOT being enforced by this build."

        - name: check.sh (fmt, clippy, man, test, audit, boundary)
          script: |
            set -euo pipefail
            bash scripts/check.sh

        - name: report
          script: |
            set -euo pipefail
            echo "check passed on ${CNB_BRANCH}@${CNB_COMMIT_SHORT}, rustc ${RUST_TOOLCHAIN}"
            echo "build ${CNB_BUILD_ID}"

  pull_request:
    - name: ci
      lock:
        key: ci-pr
        cancel-in-progress: true
      docker:
        image: rust:1.99.1-bookworm
        volumes:
          - /usr/local/rustup:copy-on-write-read-only
          - /usr/local/cargo:copy-on-write-read-only
      env:
        RUST_TOOLCHAIN: "1.99.1"
        RUSTUP_HOME: /usr/local/rustup
        CARGO_HOME: /usr/local/cargo
      stages: *stages
