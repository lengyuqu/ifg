# CNB is the development upstream (see AGENTS.md), so the Linux check runs here
# as well as on GitHub. `scripts/check.sh` is invoked unchanged: it is the same
# script .github/workflows/ci.yml runs.
#
# Boundary: this file only covers the Linux check. The Windows job and the
# four-architecture release stay on GitHub (.github/workflows/), untouched:
# `ring` needs each platform's own C toolchain, so they cannot move here.
#
# Toolchain: the image tag is pinned to the exact patch release and must agree
# with rust-toolchain.toml. The `rustc --version` assertion turns a silently
# re-tagged image into a red build instead of drift.
#
# Volumes: cache the two directories cargo actually writes, `$CARGO_HOME/registry`
# (crate sources) and `$CARGO_HOME/git` (git dependencies). Never mount
# `$CARGO_HOME` or `/usr/local/rustup` themselves: a declared volume is an empty
# directory laid over the image path, and doing that wiped the toolchain the
# image ships (`rustc` came back 127 "command not found"). Mounting `.../bin`
# would take `cargo install cargo-audit` with it. Paths must be absolute —
# `~/.cargo/...` fails Prepare with "Unsupported volume path".
#
# What the cache is worth (measured 2026-11-05, two consecutive main builds):
# 192s -> 145s. `cargo-audit` 118s -> 79s, `check.sh` 64s -> 42s. The saving is
# the network fetch, not the compile: a copy-on-write volume copies file data but
# not mtimes, cargo keys its fingerprints on mtime+size, so crate sources get
# re-extracted and rebuilt either way.
#
# Advisory gate: push and PR pipelines install cargo-audit before check.sh.
# The PR cache has previously come up empty, so installation may add ~80s;
# this cost is accepted to detect advisories before merging.
#
# Interpreters: CNB runs `script` under `sh`, which is dash in these Debian
# images, so `set -euo pipefail` cannot live inline (first run died with
# "sh: 1: set: Illegal option -o pipefail"). Each stage body is a file under
# scripts/ci/ called as `bash scripts/ci/<name>.sh`; the explicit `bash` prefix
# is what selects the interpreter, not the shebang.
#
# Triggers: `main` on push, and pull requests targeting `main`. Config for a PR
# event is read from the target branch, but the run uses the source branch's
# copy of this file, so pushing to a PR branch is enough to validate it.

main:
  push:
    - name: ci
      # Supersede an in-flight run on the same branch instead of queueing.
      lock:
        key: ci
        cancel-in-progress: true
      docker:
        image: rust:1.99.1-bookworm
        volumes:
          # Node-local, overlayfs so concurrent pipelines share one copy.
          - /usr/local/cargo/registry:copy-on-write
          - /usr/local/cargo/git:copy-on-write
      env:
        RUST_TOOLCHAIN: "1.99.1"
        RUSTUP_HOME: /usr/local/rustup
        CARGO_HOME: /usr/local/cargo
      stages:
        - &toolchain-stage
          name: toolchain version assertion
          script: bash scripts/ci/toolchain.sh

        - &audit-stage
          name: cargo-audit
          # check.sh only warns when `cargo audit` is missing, so this stage has
          # to make the gate real: it installs cargo-audit or it fails.
          script: bash scripts/ci/audit.sh

        - &check-stage
          name: check.sh (fmt, clippy, man, test, audit, boundary)
          script: bash scripts/ci/check.sh

  pull_request:
    - name: ci
      lock:
        key: ci-pr
        cancel-in-progress: true
      docker:
        image: rust:1.99.1-bookworm
        volumes:
          # Declared read-only as the intent, but see the header: it mounts rw
          # and comes up empty, so nothing is shared either way.
          - /usr/local/cargo/registry:copy-on-write-read-only
          - /usr/local/cargo/git:copy-on-write-read-only
      env:
        RUST_TOOLCHAIN: "1.99.1"
        RUSTUP_HOME: /usr/local/rustup
        CARGO_HOME: /usr/local/cargo
      stages:
        - *toolchain-stage
        - *audit-stage
        - *check-stage
