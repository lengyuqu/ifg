[package]
name = "ifg"
description = "Command-line client for IronForge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ifg-client = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
comfy-table = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }

# Windows Credential Manager backend. `windows-native` is a safe wrapper over
# CredRead/CredWrite; `unsafe_code = "forbid"` applies to this workspace, not
# to dependencies.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
assert_cmd = { workspace = true }
clap_mangen = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
