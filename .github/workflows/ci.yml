# Continuous integration: the same checks the pre-commit script runs.
#
# e2e (`scripts/e2e.sh`) needs a live IronForge instance and is not wired
# here yet: the reference instance lives on an intranet host, so the job
# belongs on a self-hosted runner (add `runs-on: [self-hosted]` + a step
# that exports IFG_E2E_URL/IFG_E2E_PAT).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: install cargo-audit
        run: cargo install cargo-audit --locked

      - name: checks (fmt, clippy, test, audit, dependency boundary)
        run: bash scripts/check.sh

  # Windows has no `cargo audit` (slow) and no live IronForge for e2e; this
  # job keeps the platform compiling and the test suite green. Git Bash is
  # preinstalled on windows-latest.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: checks (fmt, clippy, test)
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p ifg -p ifg-client

  # e2e uses a disposable instance of the pinned local Docker image. Enable
  # IFG_E2E_ENABLED on a Docker-capable runner carrying the `ifg-e2e` label.
  # No deployed instance or saved user PAT is used (see docs/ci-e2e-runner.md).
  e2e:
    # Self-hosted runners must never execute code from forks: this job only
    # runs for pushes to main on the owning repository, even though the
    # rest of the workflow also triggers on pull_request.
    if: >-
      ${{ vars.IFG_E2E_ENABLED == 'true'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && github.repository_owner == 'lengyuqu' }}
    runs-on: [self-hosted, ifg-e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build the CLI the tests drive
        run: cargo build -p ifg --locked

      - name: isolated Docker e2e (full chain, fork checkout, metadata + status)
        run: bash scripts/e2e-docker.sh
