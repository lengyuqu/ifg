# Continuous integration: the same checks the pre-commit script runs.
#
# e2e (`scripts/e2e.sh`) needs a live IronForge instance and is not wired
# here yet: the reference instance lives on an intranet host, so the job
# belongs on a self-hosted runner (add `runs-on: [self-hosted]` + a step
# that exports IFG_E2E_URL/IFG_E2E_PAT).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: install cargo-audit
        run: cargo install cargo-audit --locked

      - name: checks (fmt, clippy, test, audit, dependency boundary)
        run: bash scripts/check.sh

  # e2e drives the real `ifg` binary against a live IronForge instance, so it
  # needs a runner that can reach one. Enable by setting the repository
  # variable IFG_E2E_ENABLED=true and providing the IFG_E2E_URL / IFG_E2E_PAT
  # secrets; the runner must carry the `ifg-e2e` label (see scripts/e2e.sh).
  e2e:
    # Self-hosted runners must never execute code from forks: this job only
    # runs for pushes to main on the owning repository, even though the
    # rest of the workflow also triggers on pull_request.
    if: >-
      ${{ vars.IFG_E2E_ENABLED == 'true'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && github.repository_owner == 'lengyuqu' }}
    runs-on: [self-hosted, ifg-e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build the CLI the tests drive
        run: cargo build -p ifg --locked

      - name: e2e (full chain, fork checkout, metadata + status)
        run: cargo test -p ifg-e2e --locked -- --ignored
        env:
          IFG_E2E_URL: ${{ secrets.IFG_E2E_URL }}
          IFG_E2E_PAT: ${{ secrets.IFG_E2E_PAT }}
