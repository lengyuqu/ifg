# Release: a `v*` tag builds five artifacts and publishes them with one
# merged SHA256SUMS.
#
# macOS (apple + zig/musl) and Windows (MSVC) must run on their own runners:
# `ring` needs the platform C toolchain, so the Windows zip cannot be
# cross-built from macOS. Each job runs the same scripts/release.sh (with
# --windows on the Windows runner); the publish job merges the checksums.
name: release

on:
  # A manual run builds and verifies candidate artifacts without publishing.
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  unix:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: install zig and cargo-zigbuild
        run: |
          brew install zig
          # pip --user lands in ~/Library/Python on the macOS runner (not on
          # PATH); cargo install is slower but deterministic.
          cargo install cargo-zigbuild --locked

      - name: build artifacts (adds rustup targets itself)
        run: bash scripts/release.sh

      - name: verify checksums and install the native archive
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS)
          case "$(uname -m)" in
            arm64) target=aarch64-apple-darwin ;;
            x86_64) target=x86_64-apple-darwin ;;
            *) exit 1 ;;
          esac
          candidate_dir=$(mktemp -d)
          trap 'rm -rf "$candidate_dir"' EXIT
          tar -xzf dist/ifg-*-$target.tar.gz -C "$candidate_dir"
          "$candidate_dir/ifg" --version
          test -f "$candidate_dir/man/ifg.1"

      - uses: actions/upload-artifact@v4
        with:
          name: unix
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build artifacts (native x86_64-pc-windows-msvc)
        shell: bash
        run: bash scripts/release.sh --windows

      - name: verify checksum and install the Windows zip
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem dist/ifg-*-x86_64-pc-windows-msvc.zip)
          if ($archive.Count -ne 1) { throw 'Expected one Windows archive' }
          $expected = ((Get-Content dist/SHA256SUMS) -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $archive[0].FullName -Algorithm SHA256).Hash -ne $expected) { throw 'Checksum mismatch' }
          $candidateDir = Join-Path $env:RUNNER_TEMP 'ifg-candidate-install'
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $candidateDir -Force
          & (Join-Path $candidateDir 'ifg.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed binary failed' }
          if (-not (Test-Path (Join-Path $candidateDir 'man/ifg.1'))) { throw 'Man page missing' }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  checksums:
    needs: [unix, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS (all platforms)
        run: |
          cd dist
          sha256sum ifg-*.tar.gz ifg-*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  publish:
    # Manual candidate builds can never publish, even when dispatched on a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.sha }}
          path: dist

      - name: publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ifg-*.tar.gz
            dist/ifg-*.zip
            dist/SHA256SUMS
